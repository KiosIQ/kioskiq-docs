name: Publish Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify every page is valid HTML we can serve
        run: |
          set -euo pipefail
          missing=0
          for f in site/index.html site/guides/till/index.html; do
            if [ ! -s "$f" ]; then echo "::error::missing or empty: $f"; missing=1; fi
          done
          if ! grep -qi '<!doctype html>' site/index.html; then
            echo "::error::site/index.html has no doctype"; missing=1
          fi
          if ! grep -qi '<!doctype html>' site/guides/till/index.html; then
            echo "::error::site/guides/till/index.html has no doctype"; missing=1
          fi
          exit $missing

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
